name: Publish Windows packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-store:
    runs-on: windows-latest
    steps:
      - name: Download the Store package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path packages | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY `
            --pattern '*.msixbundle' --dir packages
          if (-not (Get-ChildItem packages -Filter '*.msixbundle')) {
            throw 'The release must contain an MSIX bundle generated by PWABuilder.'
          }

      - name: Set up Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.2

      - name: Submit package to Microsoft Store
        env:
          STORE_TENANT_ID: ${{ secrets.STORE_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.STORE_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.STORE_CLIENT_SECRET }}
          STORE_SELLER_ID: ${{ secrets.STORE_SELLER_ID }}
          STORE_APP_ID: ${{ secrets.STORE_APP_ID }}
        shell: pwsh
        run: |
          msstore reconfigure --tenantId $env:STORE_TENANT_ID `
            --sellerId $env:STORE_SELLER_ID `
            --clientId $env:STORE_CLIENT_ID `
            --clientSecret $env:STORE_CLIENT_SECRET
          $package = Get-ChildItem packages -Filter '*.msixbundle' | Select-Object -First 1
          msstore publish $package.FullName --appId $env:STORE_APP_ID

  publish-winget:
    runs-on: ubuntu-latest
    steps:
      - name: Submit package to WinGet
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Usivagna.TTracker
          installers-regex: '\.msixbundle$'
          token: ${{ secrets.WINGET_TOKEN }}
